<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Museum Flashcards — Studio Museum in Harlem</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
  <h1>Museum Flashcards</h1>
  <p class="subtitle">Studio Museum in Harlem collection</p>
</header>

<div class="app-shell">
  <nav class="side-nav">
    <button class="nav-btn active" data-tab="mix">Mix &amp; Match</button>
    <button class="nav-btn" data-tab="browse">Study</button>
    <button class="nav-btn" data-tab="stats">Stats</button>
  </nav>

  <main>
    <section id="mix-tab" class="tab-panel active">
      <div class="controls">
        <label>
          Medium
          <select id="mm-type-filter">
            <option value="">All mediums</option>
          </select>
        </label>
        <label>
          Decade
          <select id="mm-decade-filter">
            <option value="">All decades</option>
          </select>
        </label>
        <button id="mm-new-set-btn">New set</button>
      </div>

      <p class="pool-count" id="mm-pool-count"></p>

      <div id="mm-empty" class="empty-state hidden">
        Not enough matching works for a set of 9 — try a broader medium or decade filter.
      </div>

      <div id="mm-grid" class="mm-grid"></div>

      <div class="actions">
        <button id="mm-submit-btn">Check answers</button>
      </div>
      <p id="mm-score" class="mm-score"></p>
    </section>

    <section id="browse-tab" class="tab-panel">
      <div class="controls">
        <label>
          Medium
          <select id="browse-type-filter">
            <option value="">All mediums</option>
          </select>
        </label>
        <label>
          Decade
          <select id="browse-decade-filter">
            <option value="">All decades</option>
          </select>
        </label>
        <button id="browse-new-set-btn">Shuffle new set</button>
      </div>

      <p class="pool-count" id="browse-pool-count"></p>

      <div id="browse-empty" class="empty-state hidden">
        No works match this filter.
      </div>

      <div id="browse-grid" class="browse-grid"></div>
    </section>

    <section id="stats-tab" class="tab-panel">
      <div id="stats-summary" class="stats-summary"></div>
      <div class="stats-table-wrap">
      <table id="stats-table" class="stats-table">
        <thead>
          <tr>
            <th></th>
            <th data-sort="title">Title</th>
            <th data-sort="artistName">Artist</th>
            <th data-sort="type">Type</th>
            <th data-sort="decade">Decade</th>
            <th data-sort="artistAcc">Artist %</th>
            <th data-sort="titleAcc">Title %</th>
            <th data-sort="decadeAcc">Decade %</th>
            <th data-sort="overallAcc">Overall %</th>
          </tr>
        </thead>
        <tbody id="stats-body"></tbody>
      </table>
      </div>
      <div id="stats-empty" class="empty-state hidden">
        No cards studied yet — head to the Mix &amp; Match tab to get started.
      </div>
    </section>
  </main>
</div>

<div id="image-preview" class="image-preview hidden">
  <img id="image-preview-img" alt="">
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
